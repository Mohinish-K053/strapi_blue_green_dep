name: CI/CD Strapi Blue/Green

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy infrastructure?"
        required: false
        default: "false"

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: strapi-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR Repository (if not exists)
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO_NAME || \
          aws ecr create-repository --repository-name $ECR_REPO_NAME

      - name: Build Docker Image
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          docker build -t $ECR_REPO_NAME:${{ github.sha }} .
          docker tag $ECR_REPO_NAME:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Push Docker Image to ECR
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Apply or Destroy Terraform
        working-directory: ./terraform
        run: |
          if [ "${{ github.event.inputs.destroy }}" = "true" ]; then
            terraform destroy -auto-approve -var="ecr_image_uri=dummy"
          else
            terraform apply -auto-approve \
              -var="ecr_image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}"

      - name: Fetch Latest Task Definition ARN (with retry)
        if: ${{ github.event.inputs.destroy != 'true' }}
        id: fetch-taskdef
        run: |
          echo "Fetching latest ECS task definition ARN (with retries)..."
          for i in {1..5}; do
            TASK_DEF_ARN=$(aws ecs list-task-definitions \
              --family-prefix strapi-task \
              --sort DESC \
              --max-items 1 \
              --query "taskDefinitionArns[0]" \
              --output text)

            if [ "$TASK_DEF_ARN" != "None" ] && [ -n "$TASK_DEF_ARN" ]; then
              echo "Found task definition ARN: $TASK_DEF_ARN"
              echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Attempt $i: ARN not ready yet, waiting 15 seconds..."
            sleep 15
          done

          echo "ERROR: Failed to fetch ECS task definition ARN after 5 attempts."
          exit 1

      - name: Create AppSpec File
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          jq -n --arg TASK_DEF "${{ steps.fetch-taskdef.outputs.task_def_arn }}" '{
            version: 1,
            Resources: [ {
              TargetService: {
                Type: "AWS::ECS::Service",
                Properties: {
                  TaskDefinition: $TASK_DEF,
                  LoadBalancerInfo: {
                    ContainerName: "strapi",
                    ContainerPort: 1337
                  }
                }
              }
            }]
          }' > appspec.json

      - name: Deploy via CodeDeploy
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          echo "Creating CodeDeploy deployment..."
          aws deploy create-deployment \
            --application-name strapi-app \
            --deployment-group-name strapi-dg \
            --revision "appSpecContent={content=$(jq -c . < appspec.json)}" \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce

name: CI/CD Strapi Blue/Green

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy infrastructure?"
        required: false
        default: "false"

env:
  AWS_REGION: ap-south-1
  ECR_REPO_NAME: strapi-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR Repository (if not exists)
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO_NAME || \
          aws ecr create-repository --repository-name $ECR_REPO_NAME

      - name: Build Docker Image
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          docker build -t $ECR_REPO_NAME:${{ github.sha }} .
          docker tag $ECR_REPO_NAME:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Push Docker Image to ECR
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Apply or Destroy Terraform
        working-directory: ./terraform
        run: |
          if [ "${{ github.event.inputs.destroy }}" = "true" ]; then
            terraform destroy -auto-approve -var="ecr_image_uri=dummy"
          else
            terraform apply -auto-approve \
              -var="ecr_image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}"
          fi

      - name: Trigger CodeDeploy Deployment
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          TASK_DEF_ARN=$(aws ecs list-task-definitions \
            --family-prefix strapi-task \
            --sort DESC \
            --max-items 1 \
            --query "taskDefinitionArns[0]" \
            --output text)

          # If task definition doesn't exist, register a new one
          if [ "$TASK_DEF_ARN" == "None" ] || [ -z "$TASK_DEF_ARN" ]; then
            echo "ERROR: No task definition found for family 'strapi-task'. Registering a new task definition."
            
            # Register a new task definition
            TASK_DEF_ARN=$(aws ecs register-task-definition \
              --family strapi-task \
              --network-mode awsvpc \
              --container-definitions '[{
                "name": "strapi",
                "image": "'"$ECR_IMAGE_URI"'",
                "essential": true,
                "portMappings": [{"containerPort": 1337, "hostPort": 1337}]
              }]' \
              --query "taskDefinition.taskDefinitionArn" \
              --output text)

            # Check if registration was successful
            if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" == "None" ]; then
              echo "ERROR: Failed to register task definition."
              exit 1
            fi
          fi

          echo "Using Task Definition: $TASK_DEF_ARN"

          # Create deployment with CodeDeploy
          aws deploy create-deployment \
            --application-name strapi-app \
            --deployment-group-name strapi-dg \
            --revision revisionType=AppSpecContent,appSpecContent='{
              "version": 1,
              "Resources": [
                {
                  "TargetService": {
                    "Type": "AWS::ECS::Service",
                    "Properties": {
                      "TaskDefinition": "'"$TASK_DEF_ARN"'",
                      "LoadBalancerInfo": {
                        "ContainerName": "strapi",
                        "ContainerPort": 1337
                      }
                    }
                  }
                }
              ]
            }' \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce

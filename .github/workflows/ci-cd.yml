name: Deploy Strapi to ECS (Blue/Green)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      destroy_infrastructure:
        description: 'Set to true to destroy infrastructure'
        required: true
        default: 'false'

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: "us-east-1"

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: "latest"

    - name: Initialize Terraform
      run: terraform init

  create-ecr:
    runs-on: ubuntu-latest
    needs: setup
    if: github.event.inputs.destroy_infrastructure != 'true'

    steps:
    - name: Create ECR Repository via Terraform
      run: terraform apply -auto-approve -target=aws_ecr_repository.strapi

  build-and-push:
    runs-on: ubuntu-latest
    needs: create-ecr
    if: github.event.inputs.destroy_infrastructure != 'true'

    steps:
    - name: Build Docker image
      run: docker build -t strapi-image .

    - name: Log in to Amazon ECR
      run: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.create-ecr.outputs.repository_url }}

    - name: Tag Docker image
      run: docker tag strapi-image:latest ${{ steps.create-ecr.outputs.repository_url }}:latest

    - name: Push Docker image to ECR
      run: docker push ${{ steps.create-ecr.outputs.repository_url }}:latest

  apply-infrastructure:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.destroy_infrastructure != 'true'

    steps:
    - name: Apply Terraform Configuration (ECS, ALB, CodeDeploy)
      run: terraform apply -auto-approve

  destroy-infrastructure:
    runs-on: ubuntu-latest
    if: github.event.inputs.destroy_infrastructure == 'true'

    steps:
    - name: Destroy Terraform Infrastructure
      run: terraform destroy -auto-approve

  deploy-strapi:
    runs-on: ubuntu-latest
    needs: apply-infrastructure
    if: github.event.inputs.destroy_infrastructure != 'true'

    steps:
    - name: Deploy Strapi via CodeDeploy (Blue/Green)
      run: |
        aws deploy create-deployment \
          --application-name strapi-app \
          --deployment-group-name strapi-deployment-group \
          --revision revisionType=AppSpecContent,appSpecContent="file://appspec.yml" \
          --deployment-config-name CodeDeployDefault.ECSAllAtOnce

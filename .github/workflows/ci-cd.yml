name: CI/CD Strapi Blue/Green

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy infrastructure?"
        required: false
        default: "false"

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: strapi-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR Repository (if not exists)
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO_NAME || \
          aws ecr create-repository --repository-name $ECR_REPO_NAME

      - name: Build and Push Docker Image
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply or Destroy
        working-directory: ./terraform
        run: |
          if [ "${{ github.event.inputs.destroy }}" = "true" ]; then
            terraform destroy -auto-approve -var="ecr_image_uri=dummy"
          else
            terraform apply -auto-approve -var="ecr_image_uri=${{ env.IMAGE_URI }}"
          fi

      - name: Render Task Definition
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          sed "s|{{IMAGE_URI}}|${{ env.IMAGE_URI }}|g" taskdef.template.json |
          sed "s|{{AWS_ACCOUNT_ID}}|${{ secrets.AWS_ACCOUNT_ID }}|g" > taskdef.rendered.json

      - name: Register ECS Task Definition
        if: ${{ github.event.inputs.destroy != 'true' }}
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.rendered.json \
            --query "taskDefinition.taskDefinitionArn" --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV
          echo "::set-output name=task_definition_arn::$TASK_DEF_ARN"

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Render AppSpec JSON
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          sed "s|{{TASK_DEF_ARN}}|$TASK_DEF_ARN|g" appspec.template.json > appspec.rendered.json

      - name: Deploy via CodeDeploy
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          # Convert JSON content for deployment revision
          APPSPEC_CONTENT=$(jq -c . < appspec.rendered.json)

          # Ensure proper escaping for AWS CLI command
          aws deploy create-deployment \
            --application-name strapi-app \
            --deployment-group-name strapi-dg \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --revision "{\"appSpecContent\":{\"content\":$APPSPEC_CONTENT}}"

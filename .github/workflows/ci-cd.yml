name: CI/CD Strapi Blue/Green

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy infrastructure?"
        required: false
        default: "false"

env:
  AWS_REGION: ap-south-1
  ECR_REPO_NAME: strapi-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR Repository (if not exists)
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO_NAME || \
          aws ecr create-repository --repository-name $ECR_REPO_NAME

      - name: Build Docker Image
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          docker build -t $ECR_REPO_NAME:${{ github.sha }} .
          docker tag $ECR_REPO_NAME:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Push Docker Image to ECR
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Apply or Destroy Terraform
        working-directory: ./terraform
        run: |
          if [ "${{ github.event.inputs.destroy }}" = "true" ]; then
            terraform destroy -auto-approve -var="ecr_image_uri=dummy"
          else
            terraform apply -auto-approve \
              -var="ecr_image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}"
          fi

      - name: Register ECS Task Definition
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}"
          
          echo "Registering new ECS task definition with image: $IMAGE_URI"

          aws ecs register-task-definition \
            --family strapi-task \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu "512" \
            --memory "1024" \
            --execution-role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole \
            --container-definitions '[
              {
                "name": "strapi",
                "image": "'"$IMAGE_URI"'",
                "portMappings": [{"containerPort": 1337, "protocol": "tcp"}],
                "essential": true
              }
            ]'

      - name: Create AppSpec File
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          # Get the latest task definition ARN
          TASK_DEF_ARN=$(aws ecs list-task-definitions \
            --family-prefix strapi-task \
            --sort DESC \
            --max-items 1 \
            --query "taskDefinitionArns[0]" \
            --output text)

          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
            echo "ERROR: No valid task definition found for family 'strapi-task'"
            exit 1
          fi

          echo "Using Task Definition: $TASK_DEF_ARN"
          
          # Create AppSpec JSON file
          echo '{
            "version": 1,
            "Resources": [
              {
                "TargetService": {
                  "Type": "AWS::ECS::Service",
                  "Properties": {
                    "TaskDefinition": "'"$TASK_DEF_ARN"'",
                    "LoadBalancerInfo": {
                      "ContainerName": "strapi",
                      "ContainerPort": 1337
                    }
                  }
                }
              }
            ]
          }' > appspec.json
          
          # Store the JSON content as an environment variable for the next step
          echo "APPSPEC_CONTENT=$(cat appspec.json | jq -c .)" >> $GITHUB_ENV

      - name: Deploy with CodeDeploy
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          aws deploy create-deployment \
            --application-name strapi-app \
            --deployment-group-name strapi-dg \
            --revision "revisionType=AppSpecContent,appSpecContent=${{ env.APPSPEC_CONTENT }}" \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce

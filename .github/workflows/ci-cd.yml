name: CI/CD Strapi Blue/Green

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPO_NAME: strapi-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR Repository (if not exists)
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO_NAME || \
          aws ecr create-repository --repository-name $ECR_REPO_NAME

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPO_NAME:${{ github.sha }} .
          docker tag $ECR_REPO_NAME:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Push Docker Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Apply Terraform
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="ecr_image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}"

      - name: Trigger CodeDeploy Deployment
        run: |
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition strapi-task \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          aws deploy create-deployment \
            --application-name strapi-app \
            --deployment-group-name strapi-dg \
            --revision revisionType=AppSpecContent,appSpecContent='{
              "version": 1,
              "Resources": [
                {
                  "TargetService": {
                    "Type": "AWS::ECS::Service",
                    "Properties": {
                      "TaskDefinition": "'"$TASK_DEF_ARN"'",
                      "LoadBalancerInfo": {
                        "ContainerName": "strapi",
                        "ContainerPort": 1337
                      }
                    }
                  }
                }
              ]
            }' \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce

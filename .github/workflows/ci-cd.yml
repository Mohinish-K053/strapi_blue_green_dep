name: CI/CD Strapi Blue/Green

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: strapi-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR Repository (if not exists)
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO_NAME || \
          aws ecr create-repository --repository-name $ECR_REPO_NAME

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPO_NAME:${{ github.sha }} .
          docker tag $ECR_REPO_NAME:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Push Docker Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO_NAME:${{ github.sha }}

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Apply Terraform
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"

      - name: Trigger CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name strapi-app \
            --deployment-group-name strapi-deployment-group \
            --revision revisionType=AppSpecContent,appSpecContent={content="{}"} \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce
